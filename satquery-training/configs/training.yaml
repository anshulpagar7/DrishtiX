# Training hyperparameters. Tuned for a single T4/A100 hackathon-budget run.

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8   # effective batch size = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3
  gradient_checkpointing: true
  bf16: true                       # fall back to fp16: true if bf16 unsupported (older GPUs)
  max_seq_length: 1024
  seed: 42

data:
  max_samples: 4000                # start small for a fast first pipeline run; raise once it works
  val_split: 0.05
  # Task mixture — controls what fraction of training examples come from each
  # VRSBench annotation type, so the model doesn't only learn captioning.
  task_mixture:
    vqa_open: 0.4
    vqa_closed: 0.3
    grounding: 0.3
